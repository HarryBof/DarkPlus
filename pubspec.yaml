name: darkplus
description: "An Android night-screen dimmer overlay synced with system brightness or manual controls."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_overlay_window: ^0.5.0
  path_provider: ^2.1.5
  screen_brightness: ^2.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
